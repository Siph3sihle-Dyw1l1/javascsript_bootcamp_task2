<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Welcome to our web application!</h1>
    <hr>
    <p>
        Please enter the student's details below to determine the student's outcome.
    </p>

    <section>
        <div class="form_container">
            <form id="stud">
                <lable for="name">Name: </lable>
                <input type="text" id="name" name="name"  placeholder="Enter Student's name">

                <lable for="mark">Mark: </lable>
                <input type="number" id="mark" name="mark" required placeholder="Enter Student's mark(%)">

                <button type="button" onclick="determineStudentResults()">Submit</button>
            </form>
        </div>
    </section>

    
    <section id="results">

    </section>

    <section id="studList">
        <div>
            <button type="button" onclick="viewStudList()" >View Student List</button>
        </div>
        
        <div id="list_of_student">

        
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
